[project]
name = "agentcouncil"
version = "0.0.1"
description = "A multi-agent deliberation framework where autonomous AI agents independently analyze, challenge, and refine ideas."
readme = "README.md"
requires-python = ">=3.13"
# Runtime dependency for terminal animation; the GUI remains opt-in.
dependencies = [
    "yaspin>=3.5.1",
]

# No [project.scripts]: this project isn't packaged (no [build-system] — see
# the note above about staying stdlib-only/run-in-place), so `uv sync` never
# installs console-script shims for entry points defined here — they'd sit
# there as dead metadata. Run everything as `uv run python main.py ...` /
# `uv run python -m src.web.main` from the repo root instead (see README).

[project.optional-dependencies]
gui = [
    "customtkinter>=5.2.2",
]
web = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pre-commit>=4.0.1",
    "ruff>=0.14.1",
    "mypy>=1.14.1",
]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Корень проекта в sys.path, чтобы работали импорты "src.*" и "main"
pythonpath = ["."]
